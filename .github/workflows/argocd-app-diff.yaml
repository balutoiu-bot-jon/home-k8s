name: "Argo CD Deterministic Validation"

on:
  pull_request:
    branches:
      - main
    paths:
      - argo-cd/apps/**
      - argo-cd/extras/**
      - argo-cd/helm_values/**
      - .github/workflows/argocd-app-diff.yaml
      - .github/workflows/argocd-app-live-diff.yaml
      - scripts/argo-cd/**

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Install deterministic validation tools
        shell: bash
        env:
          # renovate: datasource=github-releases depName=helm packageName=helm/helm
          HELM_VERSION: v4.2.3
          # renovate: datasource=github-releases depName=kubeconform packageName=yannh/kubeconform
          KUBECONFORM_VERSION: v0.8.0
          # renovate: datasource=github-releases depName=yq packageName=mikefarah/yq
          YQ_VERSION: v4.53.3
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install -m 555 /tmp/linux-amd64/helm /usr/local/bin/helm

          curl -sSL -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 555 /tmp/kubeconform /usr/local/bin/kubeconform

          curl -sSL -o /tmp/yq.tar.gz "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64.tar.gz"
          tar -xzf /tmp/yq.tar.gz -C /tmp
          sudo install -m 555 /tmp/yq_linux_amd64 /usr/local/bin/yq

      - name: Validate scripts, RBAC, and rendered manifests
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/argo-cd/show-app-diff.sh scripts/argo-cd/post-gh-pr-diff-comment.sh scripts/argo-cd/tests/*.sh
          scripts/argo-cd/tests/home-backup-rbac-test.sh
          scripts/argo-cd/tests/home-backup-manifest-test.sh
          scripts/argo-cd/tests/show-app-diff-test.sh
          scripts/argo-cd/tests/post-gh-pr-diff-comment-test.sh
